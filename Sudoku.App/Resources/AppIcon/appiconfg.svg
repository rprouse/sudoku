<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg width="456" height="456" viewBox="0 0 456 456" xmlns="http://www.w3.org/2000/svg">
    <!-- Ensō — zen brush-stroke circle -->
    <!-- Center: (228, 228), radius: 85, gap at top-right -->
    <!-- Two arcs simulate brush pressure: thick body tapering to thin tail -->

    <!-- Main body — bold stroke where brush presses firmly -->
    <path d="M 293 173 A 85 85 0 1 1 199 148"
          fill="none" stroke="white" stroke-width="22" stroke-linecap="round"/>

    <!-- Tapered tail — brush lifting off the paper -->
    <path d="M 199 148 A 85 85 0 0 1 243 144"
          fill="none" stroke="white" stroke-width="7" stroke-linecap="round"/>
</svg>
