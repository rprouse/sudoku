<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg width="456" height="456" viewBox="0 0 456 456" xmlns="http://www.w3.org/2000/svg">
    <!-- Sudoku grid icon - compact for Android adaptive icon safe zone -->
    <!-- Grid: 198x198 centered (129 to 327), well within ~25% margin -->
    <!-- Big box: 66, Cell: 22 -->

    <!-- Outer border -->
    <rect x="129" y="129" width="198" height="198" rx="4" fill="none" stroke="white" stroke-width="8"/>

    <!-- Thick box dividers -->
    <line x1="195" y1="129" x2="195" y2="327" stroke="white" stroke-width="5"/>
    <line x1="261" y1="129" x2="261" y2="327" stroke="white" stroke-width="5"/>
    <line x1="129" y1="195" x2="327" y2="195" stroke="white" stroke-width="5"/>
    <line x1="129" y1="261" x2="327" y2="261" stroke="white" stroke-width="5"/>

    <!-- Thin cell dividers (vertical) -->
    <line x1="151" y1="129" x2="151" y2="327" stroke="white" stroke-width="1" opacity="0.35"/>
    <line x1="173" y1="129" x2="173" y2="327" stroke="white" stroke-width="1" opacity="0.35"/>
    <line x1="217" y1="129" x2="217" y2="327" stroke="white" stroke-width="1" opacity="0.35"/>
    <line x1="239" y1="129" x2="239" y2="327" stroke="white" stroke-width="1" opacity="0.35"/>
    <line x1="283" y1="129" x2="283" y2="327" stroke="white" stroke-width="1" opacity="0.35"/>
    <line x1="305" y1="129" x2="305" y2="327" stroke="white" stroke-width="1" opacity="0.35"/>

    <!-- Thin cell dividers (horizontal) -->
    <line x1="129" y1="151" x2="327" y2="151" stroke="white" stroke-width="1" opacity="0.35"/>
    <line x1="129" y1="173" x2="327" y2="173" stroke="white" stroke-width="1" opacity="0.35"/>
    <line x1="129" y1="217" x2="327" y2="217" stroke="white" stroke-width="1" opacity="0.35"/>
    <line x1="129" y1="239" x2="327" y2="239" stroke="white" stroke-width="1" opacity="0.35"/>
    <line x1="129" y1="283" x2="327" y2="283" stroke="white" stroke-width="1" opacity="0.35"/>
    <line x1="129" y1="305" x2="327" y2="305" stroke="white" stroke-width="1" opacity="0.35"/>

    <!-- Numbers — y values offset by +font_size*0.35 (~5.6) for visual centering -->
    <!-- Cell centers: 140,162,184 | 206,228,250 | 272,294,316 -->
    <g fill="white" font-family="sans-serif" font-weight="bold" font-size="16" text-anchor="middle">
        <text x="140" y="145.6">5</text>
        <text x="316" y="145.6">3</text>
        <text x="228" y="167.6">8</text>
        <text x="162" y="189.6">9</text>
        <text x="272" y="211.6">1</text>
        <text x="228" y="234" font-size="18">7</text>
        <text x="184" y="255.6">4</text>
        <text x="250" y="277.6">2</text>
        <text x="294" y="299.6">6</text>
    </g>
</svg>
