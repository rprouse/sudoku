<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg width="456" height="456" viewBox="0 0 456 456" xmlns="http://www.w3.org/2000/svg">
    <!-- Sudoku grid splash screen -->
    <!-- Grid: 312x312 centered (72 to 384) -->
    <!-- Big box: 104, Cell: ~34.67 -->

    <!-- Outer border -->
    <rect x="72" y="72" width="312" height="312" rx="6" fill="none" stroke="white" stroke-width="10"/>

    <!-- Thick box dividers -->
    <line x1="176" y1="72" x2="176" y2="384" stroke="white" stroke-width="6"/>
    <line x1="280" y1="72" x2="280" y2="384" stroke="white" stroke-width="6"/>
    <line x1="72" y1="176" x2="384" y2="176" stroke="white" stroke-width="6"/>
    <line x1="72" y1="280" x2="384" y2="280" stroke="white" stroke-width="6"/>

    <!-- Thin cell dividers (vertical) -->
    <line x1="106.7" y1="72" x2="106.7" y2="384" stroke="white" stroke-width="1.5" opacity="0.4"/>
    <line x1="141.3" y1="72" x2="141.3" y2="384" stroke="white" stroke-width="1.5" opacity="0.4"/>
    <line x1="210.7" y1="72" x2="210.7" y2="384" stroke="white" stroke-width="1.5" opacity="0.4"/>
    <line x1="245.3" y1="72" x2="245.3" y2="384" stroke="white" stroke-width="1.5" opacity="0.4"/>
    <line x1="314.7" y1="72" x2="314.7" y2="384" stroke="white" stroke-width="1.5" opacity="0.4"/>
    <line x1="349.3" y1="72" x2="349.3" y2="384" stroke="white" stroke-width="1.5" opacity="0.4"/>

    <!-- Thin cell dividers (horizontal) -->
    <line x1="72" y1="106.7" x2="384" y2="106.7" stroke="white" stroke-width="1.5" opacity="0.4"/>
    <line x1="72" y1="141.3" x2="384" y2="141.3" stroke="white" stroke-width="1.5" opacity="0.4"/>
    <line x1="72" y1="210.7" x2="384" y2="210.7" stroke="white" stroke-width="1.5" opacity="0.4"/>
    <line x1="72" y1="245.3" x2="384" y2="245.3" stroke="white" stroke-width="1.5" opacity="0.4"/>
    <line x1="72" y1="314.7" x2="384" y2="314.7" stroke="white" stroke-width="1.5" opacity="0.4"/>
    <line x1="72" y1="349.3" x2="384" y2="349.3" stroke="white" stroke-width="1.5" opacity="0.4"/>

    <!-- Numbers — y values offset by +font_size*0.35 (~10) for visual centering -->
    <!-- Cell centers x/y: 89.3,124,158.7 | 193.3,228,262.7 | 297.3,332,366.7 -->
    <g fill="white" font-family="sans-serif" font-weight="bold" font-size="28" text-anchor="middle">
        <!-- Row 1 -->
        <text x="89.3" y="99.3">5</text>
        <text x="262.7" y="99.3">6</text>
        <!-- Row 2 -->
        <text x="193.3" y="134">8</text>
        <text x="366.7" y="134">3</text>
        <!-- Row 3 -->
        <text x="124" y="168.7">9</text>
        <!-- Row 4 -->
        <text x="89.3" y="203.3">8</text>
        <text x="297.3" y="203.3">1</text>
        <!-- Row 5 (center) -->
        <text x="158.7" y="239.2">6</text>
        <text x="228" y="239.2" font-size="32">3</text>
        <text x="332" y="239.2">7</text>
        <!-- Row 6 -->
        <text x="124" y="272.7">4</text>
        <text x="366.7" y="272.7">9</text>
        <!-- Row 7 -->
        <text x="262.7" y="307.3">2</text>
        <!-- Row 8 -->
        <text x="89.3" y="342">2</text>
        <text x="228" y="342">5</text>
        <!-- Row 9 -->
        <text x="193.3" y="376.7">1</text>
        <text x="366.7" y="376.7">7</text>
    </g>
</svg>
