name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: 🧪 Build & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: 🔧 Setup .NET 8
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '8.0.x'

      - name: 🏗️ Build Core
        run: dotnet build Sudoku.Core

      - name: ✅ Run Tests
        run: dotnet test Sudoku.Tests --verbosity normal

  build-android:
    name: 🤖 Build MAUI Android
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: 🔧 Setup .NET 10
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
          include-prerelease: true

      - name: 📦 Install MAUI Workloads
        run: dotnet workload restore Sudoku.App/Sudoku.App.csproj

      - name: 🏗️ Build Android
        run: dotnet build Sudoku.App -f net10.0-android

  build-windows:
    name: 🪟 Build MAUI Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - name: 🔧 Setup .NET 10
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
          include-prerelease: true

      - name: 📦 Install MAUI Workloads
        run: dotnet workload restore Sudoku.App/Sudoku.App.csproj

      - name: 🏗️ Build Windows
        run: dotnet build Sudoku.App -f net10.0-windows10.0.19041.0
